<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="phunha-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24483B"/>
      <stop offset="100%" stop-color="#142B22"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="160" cy="160" r="156" fill="url(#phunha-bg)" stroke="url(#gold-grad)" stroke-width="4"/>
  <circle cx="160" cy="160" r="146" fill="none" stroke="url(#gold-grad)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Top Decorative Crown / Leaf Motif -->
  <path d="M160 38 C152 48 140 54 130 52 C142 58 152 68 160 80 C168 68 178 58 190 52 C180 54 168 48 160 38 Z" fill="url(#gold-grad)"/>

  <!-- Category Label -->
  <text x="160" y="104" text-anchor="middle" fill="#E8D8B0" font-family="'Plus Jakarta Sans', 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="4">CHÀ BÔNG &amp; KHÔ</text>

  <!-- Main Brand Name -->
  <text x="160" y="156" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Times New Roman', Georgia, serif" font-size="34" font-weight="900" letter-spacing="2">PHÚ NHÃ</text>

  <!-- Divider with Diamond -->
  <line x1="60" y1="174" x2="140" y2="174" stroke="url(#gold-grad)" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="160,170 164,174 160,178 156,174" fill="url(#gold-grad)"/>
  <line x1="180" y1="174" x2="260" y2="174" stroke="url(#gold-grad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Slogan -->
  <text x="160" y="202" text-anchor="middle" fill="#F4E8C1" font-family="'Quicksand', 'Playfair Display', serif" font-size="13.5" font-weight="600" font-style="italic" letter-spacing="0.8">Đậm vị ngon, trọn tình nhà</text>

  <!-- Bottom Heritage Seal -->
  <rect x="100" y="224" width="120" height="24" rx="12" fill="#9E472A" stroke="url(#gold-grad)" stroke-width="1"/>
  <text x="160" y="240" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.5">GIA TRUYỀN 30 NĂM</text>

  <!-- Distributor Mark -->
  <text x="160" y="278" text-anchor="middle" fill="#88B89E" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.5">PHÂN PHỐI BỞI G-ROOSTER CO.,LTD</text>
</svg>
